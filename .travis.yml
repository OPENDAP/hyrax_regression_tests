dist: jammy

language: shell

# compiler: gcc

branches:
  only:
    - master

services:
  - docker

before_install:
  - docker pull opendap/hyrax:snapshot
  - docker run -d -h hyrax -p 8080:8080 --name=hyrax_container opendap/hyrax:snapshot -n http://localhost:8080
  - docker ps -a

before_script:
  - autoreconf --force --install --verbose
  
stages:
  - name: test

jobs:
  include:
  - stage: test
    script: 
    - ./configure
    - make check
    - echo "DONE"
    
